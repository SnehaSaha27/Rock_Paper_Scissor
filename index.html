<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock_paper_scissor</title>
    <style>
        body{
            background-color: white;
            color:black;
            font-family: Arial;
        }
        .title
        {
          font-size: 30px;
          font-weight: bold;
          text-decoration: underline;
        }
        .move-icon{
            height: 70px;
            background-color: white;
        }

        .move-button{
             background-color: transparent;
             border :3px solid green;
             width :120px;
             height :120px;
             border-radius: 60px;
             margin-right: 10px;
             cursor: pointer;
        }

        .result{
            font-size: 25px;
            font-weight: bold;
            margin-top: 50px;
        }

        .score{
             margin-top: 10px;
             margin-bottom:15px ;
        }

        .reset-score-button,
        .Auto-play-button{
            background-color: yellow;
            border:none;
            font-size: 15px;
            padding: 8px 15px;
            cursor: pointer;
        }

        .heading{
            margin-top:40px;
            margin-bottom:5px;
            text-decoration: underline;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <p class ="title">Rock Paper scissor</p>
    <button class="move-button js-rock-button"><img src = "images/Rock-1.png" class = "move-icon" alt=""></button>
    <button class="move-button js-paper-button"><img src="images/Paper-1.png" class = "move-icon" alt=""></button>
    <button class="move-button js-scissor-button"><img src="images/Scissor-1.png" class = "move-icon" alt=""></button>

    <p class = "js-result result"></p>
    <p class ="js-moves"></p>
    <span class ="heading">Your score</span>
    <p class = "js-score score"></p>

    <button onclick = "
     score.wins = 0;
     score.lose = 0;
     score.tie = 0;
     localStorage.removeItem('score');
     updateScoreElement();
    " class="reset-score-button">Reset</button>
    <button class ="Auto-play-button" onclick="
    autoplay();
    ">AutoPlay</button>

<script>
    let score = JSON.parse(localStorage.getItem('score'))||{
wins :0,
lose :0,
tie :0
    };

   updateScoreElement();

   let isAutoPlaying = false;

   let intervalId;
 
   function autoplay()
   {
    if(!isAutoPlaying){
   intervalId =  setInterval(function(){
     const playerMove = pickComputerMove();
     play(playerMove);
    },1000);

    isAutoPlaying = true;
}

else{

    clearInterval(intervalId);
    isAutoPlaying = false;
}
   }

document.querySelector('.js-rock-button')
.addEventListener('click',() => {
    play('Rock');
});


document.querySelector('.js-paper-button')
.addEventListener('click',() => {
    play('Paper');
});


document.querySelector('.js-scissor-button')
.addEventListener('click',() => {
    play('Scissor');
});
  
document.body.addEventListener('keydown',(event) =>{
    if(event.key === 'r')
    play('rock');
    else if(event.key === 'p')
    play('paper');
    else if(event.key === 's')
    play('scissor');
});
    function play(playerMove)
    {
        const computerMove = pickComputerMove();
        let result = '';

        if(playerMove === 'Rock')
    {
        if(computerMove === 'Rock')
        result = 'Tie';
        else if(computerMove === 'Scissor')
        result = 'Win';
        else if(computerMove === 'Paper' )
        result = 'Lose';
    }
    else if(playerMove === 'Paper')
    {
        if(computerMove === 'Rock')
        result = 'Win';
        else if(computerMove === 'Scissor')
        result = 'Lose';
        else if(computerMove === 'Paper' )
        result = 'Tie';
    }
    else if(playerMove === 'Scissor')
    {
        if(computerMove === 'Rock')
        result = 'Lose';
        else if(computerMove === 'Scissor')
        result = 'Tie';
        else if(computerMove === 'Paper' )
        result = 'Win';
    }

    if(result === 'Win')
    score.wins +=1;
    else if(result === 'Lose')
    score.lose +=1;
    else if(result === 'Tie')
    score.tie +=1;

   localStorage.setItem('score',JSON.stringify(score));

   updateScoreElement();

    document.querySelector('.js-result')
   .innerHTML = result;

   document.querySelector('.js-moves')
   .innerHTML =`You
 <img src="images/${playerMove}-1.png" class = "move-icon" alt=""><br>
 Computer
 <img src="images/${computerMove}-1.png" class = "move-icon" alt="">
    `;
}

    function updateScoreElement(){
document.querySelector('.js-score')
.innerHTML =`
Wins : ${score.wins}, Lose : ${score.lose}, Tie : ${score.tie}`;
    }

    function pickComputerMove()
    {
        const randomNumber = Math.random();
         let computerMove = '';

    if(randomNumber>=0 && randomNumber<1/3)
    {
        computerMove = 'Rock';
    }
    else if(randomNumber>=1/3 && randomNumber<2/3)
    {
        computerMove = 'Paper';
    }
    else if(randomNumber>=2/3 && randomNumber<1)
    {
        computerMove ='Scissor';
    }

    return computerMove;
    }

    

</script>
</body>
</html>
